name: vendor-three
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vendor-three.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Three.js and build zip
        run: |
          mkdir -p js dist
          curl -fsSL -o js/three.module.js https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js
          mkdir -p /tmp/pkg && cp index.html README.md .nojekyll /tmp/pkg/ && cp -r css js /tmp/pkg/
          (cd /tmp && zip -r "$GITHUB_WORKSPACE/dist/StaticHours-v1.0.zip" pkg)
          mv /tmp/pkg /tmp/StaticHours-v1.0 2>/dev/null || true
          rm -rf /tmp/StaticHours-v1.0
          mkdir -p /tmp/StaticHours-v1.0
          cp index.html README.md .nojekyll /tmp/StaticHours-v1.0/
          cp -r css js /tmp/StaticHours-v1.0/
          (cd /tmp && zip -qr "$GITHUB_WORKSPACE/dist/StaticHours-v1.0.zip" StaticHours-v1.0)
          ls -la js/three.module.js dist/StaticHours-v1.0.zip
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/three.module.js dist/StaticHours-v1.0.zip
          git diff --cached --quiet || (git commit -m "Vendor three.module.js and dist zip" && git push)
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES='Static Hours v1.0 - unzip and run: python3 -m http.server 8765. Offline Three.js included. Play online: https://raw.githack.com/bigoldicky/static-hours/main/index.html'
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 dist/StaticHours-v1.0.zip --clobber
          else
            gh release create v1.0.0 dist/StaticHours-v1.0.zip --title "Static Hours v1.0" --notes "$NOTES"
          fi
