name: publish-offline-package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-offline-package.yml"

permissions:
  contents: write

concurrency:
  group: publish-offline-package
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vendor Three.js r170
        run: |
          mkdir -p js dist
          curl -fsSL -o js/three.module.js \
            https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js
          test -s js/three.module.js
          wc -c js/three.module.js

      - name: Build StaticHours-v1.0.zip
        run: |
          rm -rf /tmp/StaticHours-v1.0
          mkdir -p /tmp/StaticHours-v1.0 dist
          cp index.html README.md .nojekyll /tmp/StaticHours-v1.0/
          cp -r css js /tmp/StaticHours-v1.0/
          (cd /tmp && zip -r -q "$GITHUB_WORKSPACE/dist/StaticHours-v1.0.zip" StaticHours-v1.0)
          ls -la dist/StaticHours-v1.0.zip

      - name: Commit vendored assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/three.module.js dist/StaticHours-v1.0.zip
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add three.module.js and dist/StaticHours-v1.0.zip for offline downloads"
            git push
          fi

      - name: Create GitHub Release v1.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "Release v1.0.0 already exists — uploading/replacing asset"
            gh release upload v1.0.0 dist/StaticHours-v1.0.zip --clobber
          else
            gh release create v1.0.0 dist/StaticHours-v1.0.zip \
              --title "Static Hours v1.0" \
              --notes "$(cat <<'EOF'
# Static Hours v1.0

Browser first-person psychological horror walking simulator (desktop + mobile).

## Download

- Attach this release asset: **StaticHours-v1.0.zip**
- Or branch ZIP: https://github.com/bigoldicky/static-hours/archive/refs/heads/main.zip
- Or **Code → Download ZIP** on GitHub

## Run

```bash
unzip StaticHours-v1.0.zip
cd StaticHours-v1.0
python3 -m http.server 8765
```

Open http://localhost:8765/

Three.js is included at `js/three.module.js` (offline-capable once served locally).

## Play online

https://raw.githack.com/bigoldicky/static-hours/main/index.html

(Official GitHub Pages may still 404.)
EOF
)"
          fi
